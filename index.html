<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff5555" />
<meta name="description" content="一个会心跳的粒子爱心，纯前端单文件实现，无任何外部依赖。" />
<title>粒子爱心 · 心跳</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #ff5555; }
  body { -webkit-tap-highlight-color: transparent; }
  #stage { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage.dragging { cursor: grabbing; }
  #tip {
    position: fixed; left: 0; right: 0;
    bottom: max(16px, env(safe-area-inset-bottom));
    text-align: center; pointer-events: none; user-select: none;
    font: 12px/1.8 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    letter-spacing: .22em; color: rgba(255, 255, 255, .68);
    transition: opacity .9s ease; opacity: 1;
  }
  #tip.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="tip">拖动旋转 · 滚轮缩放</div>
<script>
(function () {
  'use strict';

  /* ==================== 可调参数 ==================== */
  var CONFIG = {
    spikes:     14000,   // 粒子刺数量：越大越浓密，越吃性能
    puff:       0.42,    // 心形饱满度：0 是薄片，越大越立体
    spikeMin:   0.012,   // 最短刺长（相对心形半径）
    spikeMax:   0.070,   // 最长刺长
    distance:   3.00,    // 相机距离：越大心形越小越远
    spin:       0.22,    // 自动旋转速度（弧度/秒）
    waveSpeed:  0.55,    // 噪声流动速度：心跳波纹的流动感
    beatRise:   0.62,    // 心跳收缩时长（秒）
    beatFall:   0.62,    // 心跳回弹时长（秒）
    beatRest:   0.30,    // 两次心跳之间的停顿（秒）
    beatPeak:   1.20,    // 心跳峰值强度
    bg:         '#ff5555' // 背景色，同时也是心形本体色
  };

  /* ==================== 画布 ==================== */
  var canvas = document.getElementById('stage');
  var ctx = canvas.getContext('2d', { alpha: false });
  var tip = document.getElementById('tip');
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, CX = 0, CY = 0, SCALE = 1;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W * 0.5;
    CY = H * 0.5;
    SCALE = Math.min(W, H) * 0.5 * 0.86;
  }

  /* ==================== 心形轮廓 ==================== */
  /* 经典心形参数方程，归一化到以原点为中心、长边约为 2 的坐标 */
  function buildOutline(n) {
    var raw = [], i, t, x, y;
    for (i = 0; i < n; i++) {
      t = i / n * Math.PI * 2;
      x = 16 * Math.pow(Math.sin(t), 3);
      y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      raw.push([x, y]);
    }
    var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (i = 0; i < raw.length; i++) {
      if (raw[i][0] < minX) minX = raw[i][0];
      if (raw[i][0] > maxX) maxX = raw[i][0];
      if (raw[i][1] < minY) minY = raw[i][1];
      if (raw[i][1] > maxY) maxY = raw[i][1];
    }
    var ox = (minX + maxX) * 0.5;
    var oy = (minY + maxY) * 0.5;
    var half = Math.max(maxX - minX, maxY - minY) * 0.5;
    var out = [];
    for (i = 0; i < raw.length; i++) {
      out.push([(raw[i][0] - ox) / half, (raw[i][1] - oy) / half]);
    }
    return out;
  }

  /* ==================== 3D 值噪声 ==================== */
  function hash(i, j, k) {
    var n = Math.imul(i, 374761393) ^ Math.imul(j, 668265263) ^ Math.imul(k, 1442695041);
    n = Math.imul(n ^ (n >>> 13), 1274126177);
    n = n ^ (n >>> 16);
    return (n >>> 0) / 4294967295;
  }
  function smooth(t) { return t * t * (3 - 2 * t); }
  function noise3(x, y, z) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var u = smooth(x - xi), v = smooth(y - yi), w = smooth(z - zi);
    var x1 = xi + 1, y1 = yi + 1, z1 = zi + 1;
    var c000 = hash(xi, yi, zi), c100 = hash(x1, yi, zi);
    var c010 = hash(xi, y1, zi), c110 = hash(x1, y1, zi);
    var c001 = hash(xi, yi, z1), c101 = hash(x1, yi, z1);
    var c011 = hash(xi, y1, z1), c111 = hash(x1, y1, z1);
    var a0 = c000 + (c100 - c000) * u;
    var a1 = c010 + (c110 - c010) * u;
    var b0 = c001 + (c101 - c001) * u;
    var b1 = c011 + (c111 - c011) * u;
    var m0 = a0 + (a1 - a0) * v;
    var m1 = b0 + (b1 - b0) * v;
    return m0 + (m1 - m0) * w;
  }

  /* ==================== 生成粒子刺 ==================== */
  var outline = buildOutline(900);
  var SPIKES = { P: null, N: null, L: null, count: 0 };

  function buildSpikes(count) {
    var P = new Float32Array(count * 3);
    var N = new Float32Array(count * 3);
    var L = new Float32Array(count);
    var m = outline.length;
    var i, idx, bx, by, r, len, pz, d, side, j0, j1, f;
    for (i = 0; i < count; i++) {
      j0 = (Math.random() * m) | 0;
      j1 = (j0 + 1) % m;
      f = Math.random();
      bx = outline[j0][0] + (outline[j1][0] - outline[j0][0]) * f;
      by = outline[j0][1] + (outline[j1][1] - outline[j0][1]) * f;
      len = Math.sqrt(bx * bx + by * by) || 1;
      /* 沿射线方向向内收缩，形成实心区域的点 */
      r = Math.sqrt(Math.random());
      side = Math.random() < 0.5 ? 1 : -1;
      /* 上下两个壳面，靠边越薄，中间最厚 —— 鼓起来的心 */
      pz = side * CONFIG.puff * Math.sqrt(Math.max(0, 1 - r * r)) * len;
      idx = i * 3;
      P[idx] = bx * r;
      P[idx + 1] = by * r;
      P[idx + 2] = pz;
      d = Math.sqrt(P[idx] * P[idx] + P[idx + 1] * P[idx + 1] + pz * pz) || 1;
      N[idx] = P[idx] / d;
      N[idx + 1] = P[idx + 1] / d;
      N[idx + 2] = pz / d;
      L[i] = CONFIG.spikeMin + Math.random() * (CONFIG.spikeMax - CONFIG.spikeMin);
    }
    SPIKES.P = P; SPIKES.N = N; SPIKES.L = L; SPIKES.count = count;
  }

  /* ==================== 视角与交互 ==================== */
  var yaw = 0, pitch = -0.16;
  var zoom = 1;
  var dragging = false, lastX = 0, lastY = 0, spinHold = 0;

  function bindInput() {
    canvas.addEventListener('pointerdown', function (e) {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add('dragging');
      canvas.setPointerCapture(e.pointerId);
      tip.classList.add('hide');
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      yaw += dx * 0.008;
      pitch += dy * 0.006;
      var lim = Math.PI * 0.5 - 0.06;
      if (pitch > lim) pitch = lim;
      if (pitch < -lim) pitch = -lim;
      spinHold = 1.6;
    });
    function endDrag(e) {
      if (!dragging) return;
      dragging = false;
      canvas.classList.remove('dragging');
      try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
      spinHold = 1.2;
    }
    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);
    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoom *= (e.deltaY > 0 ? 0.92 : 1.08);
      if (zoom < 0.45) zoom = 0.45;
      if (zoom > 2.6) zoom = 2.6;
      spinHold = Math.max(spinHold, 0.6);
    }, { passive: false });
  }

  /* ==================== 渲染缓冲 ==================== */
  var BIN = 240;
  var s1x, s1y, s2x, s2y, sdep, sAlpha;
  var bins, binsTmp;

  function allocBuffers(count) {
    s1x = new Float32Array(count); s1y = new Float32Array(count);
    s2x = new Float32Array(count); s2y = new Float32Array(count);
    sdep = new Float32Array(count); sAlpha = new Float32Array(count);
    bins = new Float32Array(BIN); binsTmp = new Float32Array(BIN);
  }

  /* ==================== 主循环 ==================== */
  var t0 = 0, lastT = 0, booted = false;
  var frameAvg = 16, activeRatio = 1;

  function render(now) {
    if (!booted) { t0 = now * 0.001; lastT = t0; booted = true; }
    var t = now * 0.001;
    var dt = t - lastT;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    lastT = t;

    /* 自动旋转（拖拽或缩放后短暂停一下） */
    if (spinHold > 0) spinHold -= dt;
    if (!dragging && spinHold <= 0) yaw += CONFIG.spin * dt;

    /* 心跳节拍：急收缩 + 快回弹 + 停顿 */
    var cycle = CONFIG.beatRise + CONFIG.beatFall + CONFIG.beatRest;
    var ph = (t - t0) % cycle;
    var beat;
    if (ph < CONFIG.beatRise) {
      var p1 = ph / CONFIG.beatRise;
      beat = CONFIG.beatPeak * p1 * p1;
    } else if (ph < CONFIG.beatRise + CONFIG.beatFall) {
      var p2 = 1 - (ph - CONFIG.beatRise) / CONFIG.beatFall;
      beat = CONFIG.beatPeak * p2 * p2 * p2;
    } else {
      beat = 0;
    }

    /* 旋转矩阵 R = Rx * Ry */
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var r00 = cy,       r01 = 0,   r02 = sy;
    var r10 = sp * sy,  r11 = cp,  r12 = -sp * cy;
    var r20 = -cp * sy, r21 = sp,  r22 = cp * cy;

    var dist = CONFIG.distance;
    var gain = SCALE * zoom;
    var P = SPIKES.P, N = SPIKES.N, L = SPIKES.L;
    var total = SPIKES.count;
    var used = Math.max(600, (total * activeRatio) | 0);
    var waveT = t * CONFIG.waveSpeed;

    var i, idx, k, bi;
    for (i = 0; i < BIN; i++) bins[i] = -1;

    /* 第一遍：算噪声、算投影、累积轮廓 */
    for (i = 0; i < used; i++) {
      idx = i * 3;
      var px = P[idx], py = P[idx + 1], pz = P[idx + 2];
      var nz = noise3(px * 1.5, py * 1.5 + waveT, pz * 1.5) * 2;
      var s = 1.01 + nz * 0.15 * beat;

      var ox = px * s, oy = py * s, oz = pz * s;
      var ln = L[i];
      var tx = ox + N[idx] * ln;
      var ty = oy + N[idx + 1] * ln;
      var tz = oz + N[idx + 2] * ln;

      /* 旋转基点 */
      var ax = r00 * ox + r01 * oy + r02 * oz;
      var ay = r10 * ox + r11 * oy + r12 * oz;
      var az = r20 * ox + r21 * oy + r22 * oz;

      var zc = dist - az;
      if (zc < 0.3) zc = 0.3;
      var pf = dist / zc;

      var ux = CX + ax * gain * pf;
      var uy = CY - ay * gain * pf;

      /* 旋转刺尖 */
      var bx2 = r00 * tx + r01 * ty + r02 * tz;
      var by2 = r10 * tx + r11 * ty + r12 * tz;
      var bz2 = r20 * tx + r21 * ty + r22 * tz;
      var zc2 = dist - bz2;
      if (zc2 < 0.3) zc2 = 0.3;
      var pf2 = dist / zc2;

      s1x[i] = ux; s1y[i] = uy;
      s2x[i] = CX + bx2 * gain * pf2;
      s2y[i] = CY - by2 * gain * pf2;
      sdep[i] = az;

      /* 轮廓半径分箱（取每个角度方向上的最外点） */
      var rx = ux - CX, ry = uy - CY;
      var rad = Math.sqrt(rx * rx + ry * ry);
      var ang = Math.atan2(ry, rx) + Math.PI;
      bi = (ang / (Math.PI * 2) * BIN) | 0;
      if (bi < 0) bi = 0; else if (bi >= BIN) bi = BIN - 1;
      if (rad > bins[bi]) bins[bi] = rad;

      /* 近侧分三档亮度，做出前后层次 */
      sAlpha[i] = az < -0.35 ? 0 : (az < 0.15 ? 1 : 2);
    }

    /* 补齐空缺角度，并做两轮平滑 */
    var lastV = -1;
    for (i = 0; i < BIN; i++) { if (bins[i] >= 0) lastV = bins[i]; else if (lastV >= 0) bins[i] = lastV; }
    lastV = -1;
    for (i = BIN - 1; i >= 0; i--) { if (bins[i] >= 0) lastV = bins[i]; else if (lastV >= 0) bins[i] = lastV; }
    for (k = 0; k < 2; k++) {
      for (i = 0; i < BIN; i++) {
        var a2 = bins[(i - 1 + BIN) % BIN], b2 = bins[i], c2 = bins[(i + 1) % BIN];
        binsTmp[i] = (a2 + b2 * 2 + c2) * 0.25;
      }
      bins.set(binsTmp);
    }

    /* ==================== 绘制 ==================== */
    ctx.fillStyle = CONFIG.bg;
    ctx.fillRect(0, 0, W, H);

    /* 1. 远侧毛刺：淡淡一层，先铺底 */
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 0.9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (i = 0; i < used; i++) {
      if (sdep[i] > 0) continue;
      ctx.moveTo(s1x[i], s1y[i]);
      ctx.lineTo(s2x[i], s2y[i]);
    }
    ctx.stroke();

    /* 2. 心形本体：把远侧的毛刺盖住，做出实心感 */
    ctx.globalAlpha = 1;
    ctx.fillStyle = CONFIG.bg;
    ctx.beginPath();
    for (i = 0; i < BIN; i++) {
      var ang2 = (i + 0.5) / BIN * Math.PI * 2 - Math.PI;
      var rad2 = bins[i];
      if (rad2 < 0) rad2 = 0;
      var qx = CX + Math.cos(ang2) * rad2;
      var qy = CY + Math.sin(ang2) * rad2;
      if (i === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
    }
    ctx.closePath();
    ctx.fill();

    /* 3. 近侧毛刺：三档亮度，形成体积层次 */
    var WIDTHS = [0.9, 1.0, 1.15];
    var ALPHAS = [0.42, 0.66, 0.94];
    for (k = 2; k >= 0; k--) {
      ctx.globalAlpha = ALPHAS[k];
      ctx.lineWidth = WIDTHS[k];
      ctx.beginPath();
      for (i = 0; i < used; i++) {
        if (sdep[i] <= 0 || sAlpha[i] !== k) continue;
        ctx.moveTo(s1x[i], s1y[i]);
        ctx.lineTo(s2x[i], s2y[i]);
      }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    /* 自适应降载：连续掉帧就减少粒子数 */
    frameAvg = frameAvg * 0.92 + dt * 1000 * 0.08;
    if (frameAvg > 30 && activeRatio > 0.28) activeRatio -= 0.004;
    else if (frameAvg < 18 && activeRatio < 1) activeRatio += 0.002;

    requestAnimationFrame(render);
  }

  /* ==================== 启动 ==================== */
  function boot() {
    resize();
    var count = CONFIG.spikes;
    if (Math.min(W, H) < 520) count = Math.round(count * 0.6);
    buildSpikes(count);
    allocBuffers(count);
    bindInput();
    setTimeout(function () { tip.classList.add('hide'); }, 6000);
    requestAnimationFrame(render);
  }

  window.addEventListener('resize', resize);
  boot();
})();
</script>
</body>
</html>
